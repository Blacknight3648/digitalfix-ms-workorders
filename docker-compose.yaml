# Compose de DESARROLLO local para ms-workorders.
#
# NOTA RECOMENDADA: Para levantar la plataforma completa o microservicios con todas
# sus dependencias (Kafka, RabbitMQ, ms-catalog, etc.), ejecuta Docker Compose desde
# la carpeta central:
#
#   cd ../digitalfix-infrastructure
#   docker compose up -d --build ms-workorders
#
# Si levantas este archivo directamente:
#   docker compose up -d --build

networks:
  digitalfix-net:
    external: true
    name: digitalfix-net

services:
  ms-workorders:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-workorders-service
    ports:
      - "${APP_PORT:-8085}:8080"
    env_file:
      - path: ../digitalfix-infrastructure/.env
        required: false
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      - TNS_ADMIN=/app/wallet
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@clx44joct2djmlz9_low?TNS_ADMIN=/app/wallet}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-ADMIN}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-GCAm7DF1520.}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - PORTAL_API_KEY=${PORTAL_API_KEY:-8eb2a405dd3aaeb49844cef248694f7818ffcfc0aafbde82e449d845a82a68d2}
      - MS_USER_URL=${MS_USER_URL:-http://ms-user-service:8082}
      - JAVA_OPTS=-Djava.net.preferIPv4Stack=true
      - MS_ADMIN_QUEUES_URL=${MS_ADMIN_QUEUES_URL:-http://ms-admin-queues:8084}
    volumes:
      - ./wallet:/app/wallet:ro
    networks:
      - digitalfix-net
