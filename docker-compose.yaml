version: '3.8'

# Compose de DESARROLLO local. Se conecta a la base Oracle Autonomous usando
# la wallet y las credenciales del archivo ".env" (no versionados, ver README).
#
#   docker compose up -d --build
#
# Se une a la red compartida "digitalfix-net" (la crea digitalfix-ms-login)
# para que los demas microservicios lo alcancen por nombre.

networks:
  digitalfix-net:
    external: true
    name: digitalfix-net

services:
  ms-workorders:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-workorders-service
    ports:
      - "${APP_PORT:-8085}:8080"
    env_file:
      - .env
    environment:
      # TNS_ADMIN=./wallet se resuelve contra /app (WORKDIR del Dockerfile)
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      # ms-user en la red digitalfix-net (nombre del servicio/contenedor)
      - MS_USER_URL=${MS_USER_URL:-http://ms-user-service:8082}
      - JAVA_OPTS=-Djava.net.preferIPv4Stack=true
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin123}
      - RABBITMQ_VIRTUAL_HOST=${RABBITMQ_VIRTUAL_HOST:-/}
    volumes:
      # La wallet se monta en tiempo de ejecucion: nunca queda dentro de la imagen
      - ./wallet:/app/wallet:ro
    networks:
      - digitalfix-net
