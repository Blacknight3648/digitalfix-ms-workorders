spring:
  application:
    name: digitalfix-ms-workorders

  # Carga el archivo .env de la raiz del proyecto (si existe), asi no hay que
  # setear las variables a mano en cada PC. En Docker/EC2 no hace falta: las
  # variables llegan por "environment"/"env_file" y tienen prioridad.
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Definida en .env, ej: jdbc:oracle:thin:@<alias>_high?TNS_ADMIN=./wallet
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_workorders
    locations: classpath:db/migration

# Puerto local configurable desde .env (SERVER_PORT). En Docker queda en 8080
# y docker-compose lo publica como 8081 en el host.
server:
  port: ${SERVER_PORT:8080}
