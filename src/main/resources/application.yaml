#Swagger UI - Documentación de la API: http://localhost:8085/swagger-ui.html

spring:
  application:
    name: ms-digitalfix-workorders

  # Carga el archivo .env de la raiz del proyecto (si existe), asi no hay que
  # setear las variables a mano en cada PC. En Docker/EC2 no hace falta: las
  # variables llegan por "environment"/"env_file" y tienen prioridad.
  config:
    import: optional:file:.env[.properties]

  # Conexión al clúster de RabbitMQ
  rabbitmq:
    # Nodos del clúster separados por coma: si se cae uno, el cliente reconecta al otro.
    # Sin RABBITMQ_ADDRESSES se usa RABBITMQ_HOST:RABBITMQ_PORT (un solo nodo).
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    address-shuffle-mode: random  # reparte las conexiones entre los nodos
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    # Mensajes no entregados: el broker confirma cada publicación (ConfirmCallback) y devuelve la que
    # ninguna cola recibe (ReturnsCallback con mandatory). Ambos se registran en el log (RabbitProducerConfig).
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3

  datasource:
    # Definida en .env, ej: jdbc:oracle:thin:@<alias>_high?TNS_ADMIN=./wallet
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect
        # Evita el N+1 en los listados: las relaciones LAZY (cliente, cuadrilla y sus miembros)
        # se cargan en lotes de hasta 100 con un "IN (...)" en vez de una consulta por fila. Cada
        # consulta a Oracle Autonomous cuesta ~40 ms de red, así que esto domina el tiempo de respuesta.
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_workorders
    locations: classpath:db/migration

# Puerto local configurable desde .env (SERVER_PORT=8085). En Docker queda en 8080
# y docker-compose lo publica como 8085 en el host (8081 en la EC2 de produccion).
server:
  port: ${PORT:${SERVER_PORT:8080}}

digitalfix:
  # Topología de RabbitMQ que usa el productor (ProductorRabbitProperties). Los exchanges los declara
  # también RabbitProducerConfig; las colas y bindings son de ms-notify, dueño de la topología.
  rabbitmq:
    exchanges:
      direct: cmd.direct      # comandos punto a punto: ticket de despacho e informe PDF
      topic: cmd.topic        # notificaciones al cliente, una routing key por estado de la orden
    routing-keys:
      # Prefijo del topic: se publica email.<estado> (email.creada, email.asignada, email.cerrada...),
      # que calza con el binding email.* de q.cmd.email.
      notificacion-cliente: email
      dispatch: dispatch.ticket
      report: report.gen
  # ms-user: fuente del rol de negocio (USUARIOS/ROLES) para la autorizacion por rol.
  # En Docker MS_USER_URL apunta al contenedor (http://ms-user-service:8082).
  ms-user:
    url: ${MS_USER_URL:http://localhost:8082}
  # ms-catalog: dueño de REPUESTO y su stock. Se descuenta al asignar la orden (InventarioRepuestos).
  # En Docker MS_CATALOG_URL apunta al contenedor (http://ms-catalog-service:8080).
  ms-catalog:
    url: ${MS_CATALOG_URL:http://localhost:8088}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
