#Swagger UI - Documentación de la API: http://localhost:8085/swagger-ui.html

spring:
  application:
    name: ms-digitalfix-workorders

  # Carga el archivo .env de la raiz del proyecto (si existe), asi no hay que
  # setear las variables a mano en cada PC. En Docker/EC2 no hace falta: las
  # variables llegan por "environment"/"env_file" y tienen prioridad.
  config:
    import: optional:file:.env[.properties]

  # Conexión al clúster de RabbitMQ
  rabbitmq:
    # Nodos del clúster separados por coma: si se cae uno, el cliente reconecta al otro.
    # Sin RABBITMQ_ADDRESSES se usa RABBITMQ_HOST:RABBITMQ_PORT (un solo nodo).
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    address-shuffle-mode: random  # reparte las conexiones entre los nodos
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3

  datasource:
    # Definida en .env, ej: jdbc:oracle:thin:@<alias>_high?TNS_ADMIN=./wallet
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    table: flyway_schema_history_workorders
    locations: classpath:db/migration

# Puerto local configurable desde .env (SERVER_PORT=8085). En Docker queda en 8080
# y docker-compose lo publica como 8085 en el host (8081 en la EC2 de produccion).
server:
  port: ${PORT:${SERVER_PORT:8080}}

digitalfix:
  # Topología de RabbitMQ que usa el productor (la declara ms-notify, dueño de las colas)
  rabbitmq:
    exchanges:
      direct: cmd.direct
      topic: cmd.topic
    routing-keys:
      email: email.send
      dispatch: dispatch.ticket
      report: report.gen
  # ms-user: fuente del rol de negocio (USUARIOS/ROLES) para la autorizacion por rol.
  # En Docker MS_USER_URL apunta al contenedor (http://ms-user-service:8082).
  ms-user:
    url: ${MS_USER_URL:http://localhost:8082}
  # ms-catalog: dueño de REPUESTO y su stock. Se descuenta al asignar la orden (InventarioRepuestos).
  # En Docker MS_CATALOG_URL apunta al contenedor (http://ms-catalog-service:8080).
  ms-catalog:
    url: ${MS_CATALOG_URL:http://localhost:8088}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
