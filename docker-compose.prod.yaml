version: '3.8'

# Compose de PRODUCCION para la instancia EC2 (Ubuntu).
#
# Usa el mismo Oracle centralizado que digitalfix-ms-login (red externa
# "digitalfix-net"), igual que en desarrollo local. Por eso, en el EC2,
# primero debe estar corriendo digitalfix-ms-login (crea la red y el
# contenedor "oracle-db") antes de levantar este servicio.
#
# Las variables se leen desde un archivo ".env" que vive SOLO en el
# servidor (no se versiona, ver .env.example).
#
# Uso en el EC2:
#   docker compose -f docker-compose.prod.yaml up -d --build

networks:
  digitalfix-net:
    external: true
    name: digitalfix-net

services:
  ms-workorders:
    build:
      context: .
      dockerfile: Dockerfile
    image: digitalfix-ms-workorders:latest
    container_name: ms-workorders
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8081
      - DB_URL=${DB_URL:-${SPRING_DATASOURCE_URL}}
      - DB_USERNAME=${DB_USERNAME:-${SPRING_DATASOURCE_USERNAME}}
      - DB_PASSWORD=${DB_PASSWORD:-${SPRING_DATASOURCE_PASSWORD}}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-${DB_URL}}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-${DB_USERNAME}}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-${DB_PASSWORD}}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID}
      # ms-user en la red digitalfix-net (nombre del servicio/contenedor)
      - MS_USER_URL=${MS_USER_URL:-http://ms-user-service:8082}
      - JAVA_OPTS=${JAVA_OPTS:-}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbit-node1}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin123}
      - RABBITMQ_VIRTUAL_HOST=${RABBITMQ_VIRTUAL_HOST:-/}
    volumes:
      # Wallet de Oracle copiada a mano en el servidor (no se versiona)
      - ./wallet:/app/wallet:ro
    networks:
      digitalfix-net:
        aliases:
          - ms-workorders
          - ms-workorders-service
